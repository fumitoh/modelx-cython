name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          - {os: ubuntu-latest, python-version: "3.9"}
          - {os: macos-latest, python-version: "3.9"}
        include:
          - {os: ubuntu-24.04, python-version: "3.9"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        shell: bash
        run: python -m pip install . pytest "pandas>=2.2.2"
      - name: Unit tests
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python -m pytest --import-mode=importlib -q \
            "$GITHUB_WORKSPACE/modelx_cython/tests/test_tracer_export_contract.py" \
            "$GITHUB_WORKSPACE/modelx_cython/tests/test_provider_manifest.py" \
            "$GITHUB_WORKSPACE/modelx_cython/tests/test_powers.py" \
            "$GITHUB_WORKSPACE/modelx_cython/tests/test_read_audit.py"

  integration:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python-version: "3.9"}
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: ubuntu-latest, python-version: "3.14"}
          - {os: windows-latest, python-version: "3.11"}
          - {os: windows-latest, python-version: "3.13"}
          - {os: windows-latest, python-version: "3.14"}
          - {os: macos-latest, python-version: "3.11"}
          - {os: macos-latest, python-version: "3.14"}
    env:
      PYTEST_ADDOPTS: ${{ matrix.os == 'windows-latest' && '--basetemp=C:/t' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        shell: bash
        run: python -m pip install . pytest "pandas>=2.2.2"
      - name: Export, compiled collect and pandas tests
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python -m pytest --import-mode=importlib -q \
            "$GITHUB_WORKSPACE/modelx_cython/tests/test_samples.py::test_mx2cy_with_ref_space" \
            "$GITHUB_WORKSPACE/modelx_cython/tests/test_samples.py::test_locked_spaces" \
            "$GITHUB_WORKSPACE/modelx_cython/tests/compiled/test_compiled_contract.py::test_exported_contract_and_collection" \
            "$GITHUB_WORKSPACE/integration_tests/test_table_mixed_reads.py::test_mixed_native_and_pandas_reads_of_one_frame"
      - name: Install released lifelib sample dependencies
        if: matrix.python-version != '3.9'
        shell: bash
        run: python -m pip install "lifelib>=0.17.3" openpyxl psutil
      - name: Released lifelib model tests
        if: matrix.python-version != '3.9'
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python -m pytest --import-mode=importlib -q \
            "$GITHUB_WORKSPACE/modelx_cython/tests/test_samples.py::test_mx2cy_with_lifelib" \
            "$GITHUB_WORKSPACE/modelx_cython/tests/test_annuallife.py" \
            "$GITHUB_WORKSPACE/modelx_cython/tests/test_uslib.py"

  free-threaded:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14t"
      - name: Install package and test dependencies
        shell: bash
        run: python -m pip install . pytest "pandas>=2.2.2"
      - name: Verify free-threaded compiled execution
        working-directory: ${{ runner.temp }}
        shell: bash
        env:
          PYTHON_GIL: "0"
        run: |
          python -c "import sys, sysconfig; assert sysconfig.get_config_var('Py_GIL_DISABLED') and not sys._is_gil_enabled()"
          python -m pytest --import-mode=importlib -q \
            "$GITHUB_WORKSPACE/modelx_cython/tests/test_samples.py::test_locked_spaces" \
            "$GITHUB_WORKSPACE/modelx_cython/tests/compiled/test_collect_workers_runtime.py::test_compiled_with_one_worker_runs_four_after_compilation" \
            "$GITHUB_WORKSPACE/integration_tests/test_table_mixed_reads.py::test_mixed_native_and_pandas_reads_of_one_frame"
